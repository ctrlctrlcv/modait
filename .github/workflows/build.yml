name: Build OlkFPC

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Permite ejecutarlo manualmente desde GitHub

jobs:
  # ============================================================
  #  BUILD PARA WINDOWS
  # ============================================================
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Geode CLI
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/geode-sdk/cli/releases/latest/download/geode-cli-win.zip" -OutFile "geode-cli.zip"
          Expand-Archive -Path "geode-cli.zip" -DestinationPath "$env:USERPROFILE\.geode"
          echo "$env:USERPROFILE\.geode" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build mod
        run: |
          cmake --build build --config Release

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: OlkFPC-Windows
          path: build/*.geode

  # ============================================================
  #  BUILD PARA ANDROID (arm64-v8a y armeabi-v7a)
  # ============================================================
  build-android:
    name: Android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [ arm64-v8a, armeabi-v7a ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Geode CLI
        run: |
          curl -L "https://github.com/geode-sdk/cli/releases/latest/download/geode-cli-linux.zip" -o geode-cli.zip
          unzip geode-cli.zip -d $HOME/.geode
          echo "$HOME/.geode" >> $GITHUB_PATH

      - name: Configure CMake for Android
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-23 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build mod
        run: |
          cmake --build build --config Release

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: OlkFPC-Android-${{ matrix.abi }}
          path: build/*.geode

  # ============================================================
  #  BUILD PARA macOS (Intel + Apple Silicon)
  # ============================================================
  build-macos:
    name: macOS (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [ x86_64, arm64 ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Geode CLI
        run: |
          curl -L "https://github.com/geode-sdk/cli/releases/latest/download/geode-cli-macos.zip" -o geode-cli.zip
          unzip geode-cli.zip -d $HOME/.geode
          echo "$HOME/.geode" >> $GITHUB_PATH

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build mod
        run: |
          cmake --build build --config Release

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: OlkFPC-macOS-${{ matrix.arch }}
          path: build/*.geode

  # ============================================================
  #  BUILD PARA iOS (opcional)
  # ============================================================
  build-ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Geode CLI
        run: |
          curl -L "https://github.com/geode-sdk/cli/releases/latest/download/geode-cli-macos.zip" -o geode-cli.zip
          unzip geode-cli.zip -d $HOME/.geode
          echo "$HOME/.geode" >> $GITHUB_PATH

      - name: Configure CMake for iOS
        run: |
          cmake -B build \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build mod
        run: |
          cmake --build build --config Release

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: OlkFPC-iOS
          path: build/*.geode

  # ============================================================
  #  RELEASE AUTOMÁTICO AL HACER TAG
  # ============================================================
  release:
    name: Create Release
    needs: [ build-windows, build-android, build-macos ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -name "*.geode" -exec cp {} release/ \;
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.geode
          generate_release_notes: true
          draft: false
          prerelease: false